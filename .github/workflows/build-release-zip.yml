name: Build release zip

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - trunk
      - feature/add-zip-build

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ZIP file
        uses: 10up/action-wordpress-plugin-build-zip@stable